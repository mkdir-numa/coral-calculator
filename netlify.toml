# Static site — no build step. Netlify serves the repo root as-is.
# Connected to GitHub: every push to the default branch triggers a deploy.
[build]
  publish = "."
  command = ""

# Clean URLs so /  serves index.html.
[[redirects]]
  from = "/calculator"
  to = "/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# The JSON feeds (distributions.json, stats.json, history.json) are a
# public API: the members hub reads them server-side, and the main
# website reads them from the browser — which needs CORS. Short cache
# so a fresh distribution shows up within minutes of a deploy.
[[headers]]
  for = "/*.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=300"
