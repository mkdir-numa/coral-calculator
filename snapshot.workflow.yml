name: On-chain stats snapshot

# Reads the live Coral points aggregates and commits stats.json + history.json.
# Each commit redeploys the site so the fresh numbers are served.
on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours
  workflow_dispatch:          # allow manual runs

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Snapshot on-chain stats
        run: node snapshot.mjs
      - name: Commit if changed
        run: |
          git config user.name  "coral-stats-bot"
          git config user.email "actions@users.noreply.github.com"
          git add stats.json history.json
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "stats: on-chain snapshot"
            git push
          fi
